<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Login · Tech-Campus</title>
<!-- Diese Seite liefert der Campus-Dienst aus, ohne Login. Deshalb steht alles hier drin
     und nichts wird von der übrigen Website nachgeladen. -->
<style>
:root { --bg: #ecebe6; --surface: #f8f7f3; --fg: #1f2124; --muted: #62645f; --line: #d2d0c8; --honey: #d9840b; --honey-ink: #9a5a00; --rot: #a12722; }
@media (prefers-color-scheme: dark) { :root { --bg: #17181a; --surface: #202225; --fg: #ebeae5; --muted: #a3a49d; --line: #37393d; --honey: #f0a234; --honey-ink: #f4b45a; --rot: #ff8a80; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
.site { padding: 10px 16px; background: var(--fg); color: var(--bg); font: 800 16px "Archivo", "Arial Narrow", system-ui, sans-serif; letter-spacing: .02em; }
.site b { color: var(--honey); }
main { display: grid; place-items: center; padding: 24px 16px 64px; }
form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 22px 22px 24px; display: grid; gap: 14px; }
h1 { margin: 0; font: 800 28px/1 "Archivo", "Arial Narrow", system-ui, sans-serif; }
p { margin: 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 4px; font: 600 12px ui-monospace, monospace; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
input { font: 15px system-ui, sans-serif; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); text-transform: none; letter-spacing: 0; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }
button { font: 600 13px ui-monospace, monospace; letter-spacing: .05em; text-transform: uppercase; padding: 10px; border: 0; border-radius: 4px; background: var(--fg); color: var(--bg); cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.fehler { color: var(--rot); font-size: 14px; min-height: 1.5em; }
</style>
</head>
<body>
<header class="site">Tech<b>·</b>Campus</header>
<main>
  <form id="login" autocomplete="on">
    <h1>Login</h1>
    <p>Nur für unser Team. Konten legt der Admin an.</p>
    <label>Name <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Passwort <input name="passwort" type="password" autocomplete="current-password" required></label>
    <button type="submit">Einloggen</button>
    <div class="fehler" role="alert"></div>
  </form>
  <form id="aendern" hidden>
    <h1>Neues Passwort</h1>
    <p>Du bist mit dem Startpasswort eingeloggt. Bitte setz jetzt ein eigenes, mindestens 8 Zeichen.</p>
    <input name="name" autocomplete="username" hidden>
    <label>Neues Passwort <input name="neu" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Noch einmal <input name="neu2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit">Speichern</button>
    <div class="fehler" role="alert"></div>
  </form>
</main>
<script>
(function () {
  "use strict";
  /* Wohin nach dem Login? nginx hängt die ursprüngliche Adresse als ?weiter=... an. */
  var q = location.search, i = q.indexOf("weiter=");
  var weiter = i >= 0 ? q.slice(i + 7) : "/website/";
  try { weiter = decodeURIComponent(weiter); } catch (e) { /* bleibt roh */ }
  if (weiter.charAt(0) !== "/" || weiter.charAt(1) === "/" || weiter.charAt(1) === "\\") weiter = "/website/";

  var altesPasswort = "";

  function post(pfad, daten) {
    return fetch(pfad, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(daten), credentials: "same-origin" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.fehler || "Fehler " + r.status); return j; }); });
  }
  function absenden(form, arbeit) {
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var knopf = form.querySelector("button"), fehler = form.querySelector(".fehler");
      knopf.disabled = true; fehler.textContent = "";
      arbeit(form).catch(function (e) { fehler.textContent = e.message; }).then(function () { knopf.disabled = false; });
    });
  }
  function zeigeAendern() {
    document.getElementById("login").hidden = true;
    var f = document.getElementById("aendern");
    f.hidden = false; f.elements.neu.focus();
  }

  absenden(document.getElementById("login"), function (f) {
    altesPasswort = f.elements.passwort.value;
    return post("/api/login", { name: f.elements.name.value, passwort: altesPasswort }).then(function (j) {
      document.getElementById("aendern").elements.name.value = f.elements.name.value;
      if (j.muss_aendern) zeigeAendern(); else location.replace(weiter);
    });
  });
  absenden(document.getElementById("aendern"), function (f) {
    if (f.elements.neu.value !== f.elements.neu2.value) return Promise.reject(new Error("Die beiden Passwörter sind verschieden."));
    return post("/api/passwort", { alt: altesPasswort, neu: f.elements.neu.value }).then(function () { location.replace(weiter); });
  });

  /* Schon eingeloggt (z. B. Link aus Discord geöffnet)? Dann gleich weiter. */
  fetch("/api/ich", { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (j && !j.muss_aendern) location.replace(weiter);
  }).catch(function () {});
  document.getElementById("login").elements.name.focus();
})();
</script>
</body>
</html>
