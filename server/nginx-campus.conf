# Campus-Website auf dem Campus-Server, hinter dem Nginx Proxy Manager (NPM) mit Authentik.
# Kopieren nach /etc/nginx/conf.d/<domain>.conf, dann NPM-IP-ADRESSE durch die IP-Adresse
# des NPM-Servers und DOMAIN-EINTRAGEN durch die Domain ersetzen (README, Schritt 9).
#
# Den Login (Single Sign-on über Authentik) und HTTPS macht NPM. Dieser Server spricht nur
# einfaches http und nur mit NPM. nginx liefert die Dateien selbst aus dem Repo aus, fragt
# aber vorher bei jedem Aufruf den Campus-Dienst (auth_request), ob die Person rein darf.
# Der Dienst prüft dafür den Authentik-Benutzernamen und das geheime Proxy-Passwort von NPM.

upstream campus_dienst {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN-EINTRAGEN;

    # Nur NPM darf hier rein. Alle anderen bekommen 403.
    # Kein set_real_ip_from/real_ip_header: das ersetzt die Absender-Adresse schon vor
    # allow/deny durch die des Besuchers, dann bekäme jeder 403.
    allow NPM-IP-ADRESSE;
    deny all;

    # Umleitungen (zum Beispiel / auf /website/) ohne Host und Port, sonst zeigen sie
    # auf http://<interner Name>:80 statt auf die Adresse hinter NPM
    absolute_redirect off;

    root /srv/campus/repo;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Versteckte Dateien und Ordner (.git und alles mit Punkt vorne) gibt es nie
    location ~ /\. {
        return 404;
    }

    # API: der Campus-Dienst (prüft die Anmeldung selbst)
    location /api/ {
        proxy_pass http://campus_dienst;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Schematic-Import: größere Uploads, und die Vorschau darf etwas rechnen
    location ^~ /api/import/ {
        client_max_body_size 21m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://campus_dienst;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Anmelde-Prüfung für auth_request, von außen nicht erreichbar.
    # Die Header von NPM (X-authentik-*, X-Campus-Proxy) gehen automatisch mit.
    location = /_auth {
        internal;
        proxy_pass http://campus_dienst/api/auth;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        return 302 /website/;
    }

    # Nur diese Ordner werden ausgeliefert, und nur mit gültiger Anmeldung
    location ~ ^/(website|campus|gebaeude|texturen|download|team)/ {
        auth_request /_auth;
        error_page 401 403 = @kein_zugang;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }
    location @kein_zugang {
        default_type "text/plain; charset=utf-8";
        return 403 "Kein Zugang. Du musst angemeldet sein und ein Campus-Konto haben, sonst einen Admin fragen.\n";
    }

    # Alles andere (tools/, server/, schematics/, README …) gibt es nicht
    location / {
        return 404;
    }
}
