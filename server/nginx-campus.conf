# Campus-Website hinter Login. Kopieren nach /etc/nginx/conf.d/campus.conf
# und campus.example.org durch die echte Domain ersetzen. HTTPS trägt danach certbot ein.
#
# nginx liefert die Dateien selbst aus dem Repo aus, fragt aber vorher bei jedem Aufruf
# den Campus-Dienst (auth_request), ob der Login gültig ist. Ohne Login gibt es nur /login.

upstream campus_dienst {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name campus.example.org;

    root /srv/campus/repo;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Versteckte Dateien und Ordner (.git und alles mit Punkt vorne) gibt es nie
    location ~ /\. {
        return 404;
    }

    # Login-Seite und API: der Campus-Dienst
    location = /login {
        proxy_pass http://campus_dienst;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://campus_dienst;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Login-Prüfung für auth_request, von außen nicht erreichbar
    location = /_auth {
        internal;
        proxy_pass http://campus_dienst/api/auth;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        return 302 /website/;
    }

    # Nur diese Ordner werden ausgeliefert, und nur mit Login
    location ~ ^/(website|campus|gebaeude|texturen|download|team)/ {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ =404;
    }
    location @login {
        return 302 /login?weiter=$request_uri;
    }

    # Alles andere (tools/, server/, schematics/, README …) gibt es nicht
    location / {
        return 404;
    }
}
