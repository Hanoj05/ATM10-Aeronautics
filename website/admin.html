<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261114">
</head>
<body>
<header class="site"><a class="brand" href="index.html">Tech<b>·</b>Campus</a><nav id="nav" aria-label="Hauptnavigation"></nav></header>
<header class="topbar">
  <h1>Admin</h1>
  <span class="sub">Konten anlegen, zurücksetzen, sperren</span>
</header>
<main class="page">
  <p class="note" id="hinweis" hidden></p>
  <section class="box scrollx">
    <table class="matrix konten">
      <thead><tr><th>Konto</th><th>Rolle</th><th>Status</th><th>Letzter Login</th><th>Aktionen</th></tr></thead>
      <tbody id="konten"><tr><td colspan="5" class="note">Lade Konten …</td></tr></tbody>
    </table>
  </section>
  <section class="box formbox">
    <h2>Neues Konto</h2>
    <form id="neu" class="formular">
      <label>Kontoname <input name="id" pattern="[a-z][a-z0-9\-]{1,23}" maxlength="24" autocapitalize="none" spellcheck="false" required placeholder="z. B. felix"></label>
      <label>Anzeigename <input name="anzeigename" maxlength="40" required placeholder="z. B. Felix"></label>
      <label>Minecraft-Name <input name="minecraft" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" placeholder="z. B. MultiBilliardaer"></label>
      <label>Startpasswort <input name="passwort" type="text" minlength="8" autocomplete="off" required></label>
      <label class="haken"><input name="admin" type="checkbox"> Admin</label>
      <div class="knoepfe"><button type="submit" class="knopf">Konto anlegen</button><span class="meldung" role="status"></span></div>
    </form>
    <p class="note">Das Startpasswort muss beim ersten Login geändert werden. Bis dahin kommt jeder mit Name und Startpasswort rein, also erst anlegen, wenn die Person sich gleich einloggt.</p>
  </section>
</main>
<script src="js/voxel.js?v=20261114"></script>
<script src="js/admin.js?v=20261114"></script>
</body>
</html>
