<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanban</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261115">
</head>
<body>
<header class="site"><a class="brand" href="index.html">Tech<b>·</b>Campus</a><nav id="nav" aria-label="Hauptnavigation"></nav></header>
<header class="topbar">
  <h1>Kanban</h1>
  <span class="sub">Was offen ist, was gerade läuft und was fertig ist</span>
  <span class="kb-live" id="live" hidden></span>
</header>
<main class="page kb-seite">
  <div class="kb-werkzeuge">
    <button type="button" class="knopf" id="neu" hidden>+ Neue Karte</button>
    <button type="button" class="knopf leise" id="meine" aria-pressed="false" hidden>Meine Aufgaben</button>
    <label class="kb-filter">Person <select id="fPerson"><option value="">alle</option></select></label>
    <label class="kb-filter">Gebäude <select id="fGebaeude"><option value="">alle</option></select></label>
    <label class="kb-filter">Bereich <select id="fBereich"><option value="">alle</option></select></label>
    <label class="kb-filter">Wo <select id="fWo"><option value="">überall</option><option>Minecraft</option><option>Website</option></select></label>
    <label class="kb-filter">Phase <select id="fPhase"><option value="">alle</option></select></label>
    <label class="kb-filter haken"><input type="checkbox" id="gruppiert"> Nach Phase gruppieren</label>
  </div>
  <section class="box kb-stand" id="stand" aria-live="polite"><p class="note">Lade Board …</p></section>
  <p class="note" id="nurLesen" hidden>Nur zum Lesen. Karten verschieben und bearbeiten geht auf dem Server mit Login.</p>
  <div id="board" class="kb-board"></div>
</main>

<dialog id="editor" class="kb-editor" aria-labelledby="edTitel">
  <form method="dialog" class="formular" id="edForm">
    <h2 id="edTitel">Karte</h2>
    <label>Titel <input name="titel" maxlength="120" required></label>
    <label>Beschreibung <textarea name="beschreibung" rows="4" maxlength="4000"></textarea></label>
    <div class="kb-zwei">
      <label>Status <select name="status"><option>offen</option><option>in Arbeit</option><option>erledigt</option></select></label>
      <label>Phase <select name="phase"></select></label>
    </div>
    <div class="kb-zwei">
      <label>Wo <select name="wo"><option>Minecraft</option><option>Website</option></select></label>
      <label>Bereich <select name="bereich"><option>Gebäude</option><option>3D</option><option>Doku</option><option>Website</option><option>Betrieb</option></select></label>
    </div>
    <div class="kb-zwei">
      <label>Gebäude <select name="gebaeude"><option value="">keins</option></select></label>
      <label>Fällig <input name="faellig" type="date"></label>
    </div>
    <fieldset class="kb-leute"><legend>Zuständig</legend><div id="edLeute"></div></fieldset>
    <div class="knoepfe">
      <button type="submit" class="knopf" value="speichern">Speichern</button>
      <button type="button" class="knopf leise" id="edAbbrechen">Abbrechen</button>
      <button type="button" class="knopf leise kb-loeschen" id="edLoeschen">Löschen</button>
    </div>
    <p class="meldung" id="edMeldung" role="status"></p>
  </form>
</dialog>
<div class="kb-toast" id="toast" role="status" hidden></div>

<script src="js/voxel.js?v=20261115"></script>
<script src="js/kanban.js?v=20261115"></script>
</body>
</html>
