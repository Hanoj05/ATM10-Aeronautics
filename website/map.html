<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus-Map</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e08a0c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>try{var t=localStorage.getItem("campus-thema");if(t==="hell"||t==="dunkel")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=20261120">
</head>
<body>
<header class="site"><a class="brand" href="index.html">Tech<b>·</b>Campus</a><nav id="nav" aria-label="Hauptnavigation"></nav></header>
<header class="topbar">
  <h1>Map</h1>
  <span class="sub" id="welt">ATM10 Aeronautics</span>
</header>
<div class="layout">
  <div class="viewport" id="viewport">
    <div class="loading" id="loading">Lade Campus …</div>
    <div class="controls">
      <span class="ctl"><button type="button" id="ansicht">Ansicht zurücksetzen</button></span>
      <label class="ctl" id="stand-feld" hidden>Stand <select id="stand" aria-label="Stand der Karte (Git-Branch)"></select></label>
      <label class="ctl" id="gelaende-feld" hidden><input type="checkbox" id="gelaende-an" checked> Gelände</label>
    </div>
    <div class="hint">Ziehen: drehen · Rechtsklick: verschieben · Mausrad: zoomen · Klick auf ein Gebäude: öffnen</div>
    <div class="tooltip" id="tooltip" hidden></div>
  </div>
  <aside class="panel">
    <div><h3>Gebäude</h3><div class="campus-list" id="liste"></div></div>
    <p class="note" id="hinweis"></p>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/voxel.js?v=20261120"></script>
<script src="js/map.js?v=20261120"></script>
</body>
</html>
