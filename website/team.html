<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261114">
</head>
<body>
<header class="site"><a class="brand" href="index.html">Tech<b>·</b>Campus</a><nav id="nav" aria-label="Hauptnavigation"></nav></header>
<header class="topbar">
  <h1>Team</h1>
  <span class="sub">Wer am Campus mitbaut</span>
</header>
<main class="page">
  <div class="team-karten" id="karten" aria-live="polite"><p class="note">Lade Team …</p></div>
  <section class="box formbox" id="passwortBox" hidden>
    <h2>Passwort ändern</h2>
    <form id="passwort" class="formular">
      <label>Bisheriges Passwort <input name="alt" type="password" autocomplete="current-password" required></label>
      <label>Neues Passwort <input name="neu" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Noch einmal <input name="neu2" type="password" autocomplete="new-password" minlength="8" required></label>
      <div class="knoepfe"><button type="submit" class="knopf">Passwort speichern</button><span class="meldung" role="status"></span></div>
    </form>
  </section>
  <p class="note">Die Profile liegen öffentlich im Repo unter <code>team/</code>. Login-Daten liegen nur auf dem Server.</p>
</main>
<script src="js/voxel.js?v=20261114"></script>
<script src="js/team.js?v=20261114"></script>
</body>
</html>
